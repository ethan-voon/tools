<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<title>Etsica Tools</title>
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root {
    --bark-200: #DFC9AB; --bark-400: #B8895A; --bark-600: #8C5E30;
    --moss-100: #D6E8C8; --moss-400: #6FA048; --moss-600: #456B27;
    --slate-100: #CCDAE6; --slate-400: #4D87AD; --slate-600: #2C6080;
    --fern-100: #C8E3D1; --fern-200: #96C9AA; --fern-600: #286B4A; --fern-700: #1B4D34;
    --ember-200: #F0C07A; --ember-400: #D4882A;
    --cedar-400: #C45849;
    --stone-0: #FFFFFF; --stone-50: #F8F6F2; --stone-100: #EDE9E2; --stone-200: #D8D3C8; --stone-300: #BDB8AC; --stone-700: #3E3B35; --stone-800: #27241F;

    --bg: var(--stone-50); --surface: var(--stone-0);
    --line: var(--stone-200); --line-soft: var(--stone-100);
    --ink: var(--stone-800); --ink-2: var(--stone-700); --ink-3: #54504A;
    --primary: var(--fern-600);

    --font: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
    --font-word: "Fredoka", system-ui, sans-serif;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --pop: cubic-bezier(.34, 1.5, .5, 1);
    color-scheme: light;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--ink);
    font-family: var(--font); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 3px; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 28px; }

  .lockup { display: flex; align-items: center; gap: 10px; }
  .mark { color: var(--primary); flex: 0 0 auto; }
  .word { font-family: var(--font-word); font-weight: 500; line-height: 1; font-size: 25px; }
  .word small { font-family: var(--font); font-size: 15px; font-weight: 550; color: var(--ink-3); margin-left: 6px; }

  .top { border-bottom: 1px solid var(--line-soft); }
  .top .wrap { display: flex; align-items: center; height: 70px; }
  .top nav { margin-left: auto; }
  .pill { display: inline-flex; align-items: center; font-size: 15px; font-weight: 600; border: 1px solid var(--line); border-radius: 9999px; padding: .6em 1.3em; transition: border-color .15s var(--ease); }
  .pill:hover { border-color: var(--ink-3); }

  .hero { position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(52% 62% at 76% 46%, rgba(212, 136, 42, .13), transparent 64%); }
  .scene { width: 100%; max-width: 480px; height: auto; justify-self: center; overflow: visible; }

  .ring { fill: none; stroke: var(--fern-200); stroke-width: 2; transform-box: fill-box; transform-origin: center; }
  .ring.g1 { animation: ringgrow .85s cubic-bezier(.34, 1.4, .5, 1) .3s both; }
  .ring.g2 { animation: ringgrow .85s cubic-bezier(.34, 1.4, .5, 1) .48s both; }
  .ring.g3 { stroke: var(--fern-100); animation: ringgrow .9s cubic-bezier(.34, 1.4, .5, 1) .66s both, ringidle 6.5s ease-in-out 3.4s infinite; }
  @keyframes ringgrow { from { opacity: 0; transform: scale(.06); } 60% { opacity: 1; } to { opacity: 1; transform: scale(1); } }
  @keyframes ringidle { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.025); opacity: .72; } }

  .dot { transform-box: fill-box; transform-origin: center; animation: pop .5s var(--ease) both; }
  .box { transform-box: fill-box; transform-origin: center; animation: pop .7s var(--pop) 1.2s both; }
  .tool, .bit { transform-box: fill-box; transform-origin: center bottom; }
  .tool.o1 { animation: pop .6s var(--pop) 1.55s both, scribble 4.8s ease-in-out 3.6s infinite; }
  .tool.o2 { animation: pop .6s var(--pop) 1.75s both; }
  .tool.o3 { animation: pop .6s var(--pop) 1.95s both; }
  .bit.t1 { animation: pop .55s var(--pop) 1.65s both, twinkle 3.2s ease-in-out 2.8s infinite; }
  .bit.t2 { animation: pop .55s var(--pop) 1.85s both, sway 5.6s ease-in-out 3s infinite; }
  .bit.t3 { animation: pop .55s var(--pop) 2.05s both, sway 5.2s ease-in-out 3.2s infinite; }
  .bit.t4 { animation: pop .55s var(--pop) 2.2s both, twinkle 3.6s ease-in-out 3.35s infinite; }
  .blade { transform-box: view-box; transform-origin: 0 -30px; }
  .blade.a { animation: snip-a 3.4s ease-in-out 3s infinite; }
  .blade.b { animation: snip-b 3.4s ease-in-out 3s infinite; }
  @keyframes pop { from { opacity: 0; transform: scale(0); } to { opacity: 1; transform: scale(1); } }
  @keyframes sway { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); } 50% { transform: scale(1.12) rotate(8deg); } }
  @keyframes scribble { 0%, 60%, 100% { transform: rotate(0); } 66% { transform: rotate(-7deg); } 72% { transform: rotate(5deg); } 78% { transform: rotate(-5deg); } 84% { transform: rotate(3deg); } }
  @keyframes snip-a { 0%, 55%, 100% { transform: rotate(0); } 63%, 79% { transform: rotate(12deg); } 71%, 87% { transform: rotate(0); } }
  @keyframes snip-b { 0%, 55%, 100% { transform: rotate(0); } 63%, 79% { transform: rotate(-12deg); } 71%, 87% { transform: rotate(0); } }

  .trail circle { fill: var(--bark-400); transform-box: fill-box; transform-origin: center; animation: dotpop .3s var(--ease) both; }
  @keyframes dotpop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }
  .hero .wrap { position: relative; display: grid; grid-template-columns: 1.02fr .98fr; gap: 40px; align-items: center; padding-top: 48px; padding-bottom: 64px; }
  .kicker { font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; color: var(--bark-600); margin-bottom: 22px; }
  h1 { font-size: clamp(42px, 6.6vw, 74px); line-height: 1; letter-spacing: -.03em; font-weight: 600; max-width: 12ch; text-wrap: balance; }
  .lede { margin-top: 24px; max-width: 38ch; font-size: clamp(17px, 2vw, 20px); line-height: 1.55; color: var(--ink-2); }

  .list { flex: 1; padding: 64px 0 96px; border-top: 1px solid var(--line-soft); }
  h2 { display: flex; align-items: center; gap: 14px; color: var(--ink-3);
    font-size: 12px; font-weight: 650; letter-spacing: .14em; text-transform: uppercase; margin-bottom: 28px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .cards { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; height: 100%; padding: 28px 30px 26px;
    background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--primary); border-radius: 20px;
    transition: transform .18s var(--ease), border-color .18s var(--ease); }
  .card:hover { transform: translateY(-3px); border-color: var(--ink-3); border-top-color: var(--primary); }
  .card h3 { font-size: 23px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
  .card p { margin-top: 8px; color: var(--ink-2); }
  .card .go { margin-top: auto; padding-top: 22px; font-size: 15px; font-weight: 600; color: var(--primary); }
  .card .go span { display: inline-block; transition: transform .18s var(--ease); }
  .card:hover .go span { transform: translateX(4px); }

  footer { border-top: 1px solid var(--line); }
  footer .wrap { padding: 36px 28px 56px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; color: var(--ink-3); font-size: 14px; }
  footer .word { font-size: 20px; color: var(--ink); }
  footer .wrap > a:last-child { margin-left: auto; }
  footer .wrap > a:last-child:hover { color: var(--ink); }

  @media (max-width: 720px) {
    .wrap, footer .wrap { padding-left: 20px; padding-right: 20px; }
    .hero .wrap { grid-template-columns: 1fr; gap: 8px; padding-top: 16px; padding-bottom: 56px; }
    .scene { order: -1; max-width: 340px; }
    .list { padding-top: 48px; }
    .cards { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
